<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IMP — prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: temná gotická retro arkáda s vtipem
   IDEA: obrácený boomer shooter — imp čaroděj sestupuje kruhy pekla
   PICTURE: samotná hra přes celou obrazovku
   COLOUR and TYPE: pekelná červeň, oranžový oheň, azurové duše; Press Start 2P + VT323
   LAYOUT: plátno přes celé okno, překryvné obrazovky */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:VT323,ui-monospace,monospace;color:#fff}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(60,6,0,.82),rgba(8,0,0,.94));text-align:center;padding:20px;overflow:auto}
.hidden{display:none!important}
h1{font-family:"Press Start 2P",monospace;font-size:clamp(44px,11vw,104px);margin:0;color:#ff5a1f;text-shadow:0 0 28px #ff2a00,5px 5px 0 #3a0400;line-height:1.05}
h2{font-family:"Press Start 2P",monospace;font-size:clamp(18px,4vw,30px);margin:0;color:#ffb36b;text-shadow:3px 3px 0 #3a0400;line-height:1.3}
p{font-size:clamp(20px,2.6vw,26px);margin:0;max-width:34em;line-height:1.15;color:#f3d6c8}
.dim{color:#c98d78;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button.big{font-family:"Press Start 2P",monospace;font-size:clamp(14px,2.6vw,20px);padding:18px 30px;min-height:44px;background:#ff5a1f;color:#1a0200;border:0;border-radius:6px;box-shadow:0 5px 0 #8a1f00,0 0 30px rgba(255,80,0,.5);cursor:pointer;margin-top:8px}
button.big.alt{background:#2a0805;color:#5ff0ff;border:2px solid #3fd8ff;box-shadow:0 5px 0 #0a3a48}
button.big:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid #5ff0ff;outline-offset:3px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:980px}
.card{flex:1 1 180px;max-width:230px;background:#2a0805;border:2px solid #ff6a2a;border-radius:10px;padding:14px;color:#fff;cursor:pointer;font:inherit;text-align:left;box-shadow:0 0 18px rgba(255,90,20,.25)}
.card:hover:not(:disabled){background:#3d0d07;transform:translateY(-2px)}
.card:disabled{opacity:.45;cursor:default}
.card .k{float:right;color:#ff6a2a;font-size:18px}
.card .rar{display:block;font-size:17px;margin-bottom:2px}
.card b{display:block;margin:2px 0 6px;color:#ffb36b;font-size:24px;font-weight:400;line-height:1}
.card span{font-size:20px;line-height:1.1;color:#f3d6c8}
.card small{display:block;margin-top:8px;color:#c98d78;font-size:17px}
.card .cost{color:#5ff0ff}
.dots{letter-spacing:2px;color:#ff6a2a}
.tbtn{position:fixed;top:8px;width:44px;height:44px;border-radius:8px;border:2px solid rgba(255,140,80,.6);background:rgba(30,4,0,.5);color:#ffb36b;font-family:"Press Start 2P",monospace;font-size:13px;cursor:pointer}
#pauseBtn{left:calc(50% - 50px)}#musicBtn{left:calc(50% + 6px)}
.abtn{position:fixed;bottom:calc(var(--bar,90px)*.12);height:calc(var(--bar,90px)*.76);width:calc(var(--bar,90px)*.95);border-radius:10px;border:2px solid rgba(255,140,80,.7);color:#ffd0a0;font-family:"Press Start 2P",monospace;font-size:9px;line-height:1.4;cursor:pointer;touch-action:none;background:linear-gradient(to top,rgba(150,40,10,.9) var(--rdy,100%),rgba(10,0,0,.85) var(--rdy,100%))}
#pentBtn{right:8px;border-color:#c060ff;color:#f0d0ff;background:linear-gradient(to top,rgba(110,20,150,.9) var(--rdy,100%),rgba(10,0,0,.85) var(--rdy,100%))}
#clawBtn{right:calc(var(--bar,90px)*.95 + 16px)}
#crouchBtn{right:calc(var(--bar,90px)*1.9 + 24px);background:rgba(10,0,0,.85)}
#crouchBtn.on{background:rgba(80,20,120,.85);border-color:#c080ff;color:#e8d0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="tbtn hidden" aria-label="Pauza">II</button>
<button id="musicBtn" class="tbtn hidden" aria-label="Hudba">♪</button>
<button id="crouchBtn" class="abtn hidden" aria-label="Plížení">PLÍŽIT</button>
<button id="clawBtn" class="abtn hidden" aria-label="Drápy">DRÁPY</button>
<button id="pentBtn" class="abtn hidden" aria-label="Pentagram">PENTA<br>GRAM</button>

<div id="start" class="ov">
  <h1>IMP</h1>
  <p>Mariňáci vtrhli do pekla. Jsi jen malý imp čaroděj, ale každá duše tě posílí.</p>
  <p>Sestupuj kruhy pekla. Obejdi stráže potichu a rozsekej je drápy, nebo spusť poplach a pal. Nepřátele můžeš i stáhnout pentagramem do pekla.</p>
  <p class="dim" id="ctrlHint"></p>
  <div class="row"><button class="big" id="playBtn">HRÁT</button><button class="big alt shopBtn">POKLADNICE</button></div>
  <p class="dim" id="best"></p>
</div>

<div id="lvl" class="ov hidden">
  <h2 id="lvlTitle">MUTACE!</h2>
  <p class="dim" id="lvlSub"></p>
  <div class="cards" id="cards"></div>
</div>

<div id="shop" class="ov hidden">
  <h2>PEKELNÁ POKLADNICE</h2>
  <p id="bank"></p>
  <div class="cards" id="shopCards"></div>
  <button class="big" id="shopBack">ZPĚT</button>
</div>

<div id="pause" class="ov hidden">
  <h2>PAUZA</h2>
  <button class="big" id="resumeBtn">POKRAČOVAT</button>
</div>

<div id="end" class="ov hidden">
  <h2 id="endTitle"></h2>
  <p id="endStats"></p>
  <p id="endSouls" style="color:#5ff0ff"></p>
  <div class="row"><button class="big" id="againBtn">ZNOVU</button><button class="big alt shopBtn">POKLADNICE</button></div>
</div>

<script>
{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const low=document.createElement('canvas'),lctx=low.getContext('2d');
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
let W=480,H=270,DPR=1,img,buf,zbuf,PROJ,PL=.66,BAR=90,VH=600;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const cw=innerWidth,ch=innerHeight;BAR=Math.round(Math.max(60,Math.min(118,ch*.17)));VH=ch-BAR;const asp=cw/VH;
  document.documentElement.style.setProperty('--bar',BAR+'px');
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  if(asp>=1){H=270;W=Math.round(H*asp);if(W>480){W=480;H=Math.round(W/asp);}}else{W=300;H=Math.round(W/asp);}
  low.width=W;low.height=H;img=lctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);zbuf=new Float32Array(W);
  PL=Math.max(.5,Math.min(.85,W/(2*H*1.35)));PROJ=W/(2*PL);
}
addEventListener('resize',resize);resize();

/* ---------- uložená data ---------- */
let META={bank:0,up:{},bestDepth:0,music:true};
try{Object.assign(META,JSON.parse(localStorage.getItem('imp-meta')||'{}'));}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('imp-meta',JSON.stringify(META));}catch(e){}};

/* ---------- textury 64×64 ---------- */
const TS=64,TM=63;
const cl=v=>v<0?0:v>255?255:v|0;
const rgb=(r,g,b)=>(0xff000000|(cl(b)<<16)|(cl(g)<<8)|cl(r))>>>0;
function rng(s){s>>>=0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function hash(a,b,s){let h=(a*374761393+b*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function makeTex(fn,seed){const t=new Uint32Array(TS*TS),R=rng(seed);for(let y=0;y<TS;y++)for(let x=0;x<TS;x++)t[y*TS+x]=fn(x,y,R);return t;}
function brickTex(b,m,seed){return makeTex((x,y,R)=>{const row=y>>4,off=(row&1)*16,bx=(x+off)>>5,lx=(x+off)&31,ly=y&15;
  if(ly<2||lx<2)return rgb(m[0]+R()*8,m[1]+R()*4,m[2]+R()*4);
  const v=hash(bx,row,seed)*40-20,n=R()*18;let k=1;
  if(ly===2||lx===2)k=1.3;else if(ly===15||lx===31)k=.6;
  if(hash(bx,row,seed+1)<.3&&Math.abs(lx-ly*1.6-6)<.8)k=.45;
  if(R()<.012)k=.5;
  return rgb((b[0]+v+n)*k,(b[1]+v*.4+n*.5)*k,(b[2]+v*.3+n*.4)*k);},seed);}
function fleshTex(seed){return makeTex((x,y,R)=>{const n=R()*20,v=Math.sin(x*.21+Math.sin(y*.15)*2.4)+Math.sin(y*.18+Math.cos(x*.12)*1.7)*.6;
  if(Math.abs(v)<.09)return rgb(70+n,6,20);if(Math.abs(v)<.17)return rgb(112+n,20,36);if(R()<.02)return rgb(60,10,18);
  const s=Math.sin(x*.5)*Math.sin(y*.4)*15;return rgb(160+n+s,48+n*.4+s*.3,58+n*.3);},seed);}
function runeAt(x,y,h){const k=(h*4)|0;x-=16;y-=16;if(Math.abs(x)>9||Math.abs(y)>11)return false;
  if(k===0)return Math.abs(x)<1.1||Math.abs(y-x*.8)<1.1;
  if(k===1)return Math.abs(x+5)<1.1||(Math.abs(y+8)<1.1&&x>-5)||Math.abs(x-y*.4)<1.1;
  if(k===2)return Math.abs(Math.hypot(x,y)-7)<1.1||(Math.abs(y)<1.1&&Math.abs(x)<4);
  return Math.abs(y)<1.1||(Math.abs(x-4)<1.1&&y<0)||(Math.abs(x+4)<1.1&&y>0);}
function obsTex(seed){return makeTex((x,y,R)=>{const n=R()*10,bx=x>>5,by=y>>5,lx=x&31,ly=y&31;
  if(lx===0||ly===0)return rgb(8,4,12);
  if(hash(bx,by,seed+3)<.4&&runeAt(lx,ly,hash(bx,by,seed+5)))return rgb(255,70,210);
  const g=((lx+ly)%23<2&&hash(bx,by,seed)<.5)?40:0;return rgb(26+n+g,16+n*.6+g,36+n+g*1.2);},seed);}
const texLava=makeTex((x,y,R)=>{const n=R()*16,v=Math.abs(Math.sin(x*.2+y*.12)+Math.sin(y*.25-x*.07)+.5*Math.sin((x+y)*.3));
  if(v<.1)return rgb(255,210,80);if(v<.22)return rgb(240,100+n,20);if(v<.36)return rgb(120+n,30,10);return rgb(40+n,22+n*.4,18);},3);
const texDoor=makeTex((x,y,R)=>{const n=R()*20,bar=x%16;
  if((y>=8&&y<13)||(y>=50&&y<55)){if((x%16)===8&&(y===10||y===52))return rgb(200,200,210);return rgb(70+n,70+n,78+n);}
  if(bar<5)return bar===0?rgb(110,110,120):rgb(40+n,40+n,46+n);
  return rgb(200+n,40+y*.6,10);},6);
function floorTex(b,seed,glow){return makeTex((x,y,R)=>{const lx=x&31,ly=y&31,bx=x>>5,by=y>>5,n=R()*16,v=hash(bx,by,seed)*24-12;
  if(lx===0||ly===0)return rgb(b[0]*.3,b[1]*.3,b[2]*.3);
  let k=1;if(lx===1||ly===1)k=1.25;else if(lx===31||ly===31)k=.7;
  if(hash(bx,by,seed+9)<.18&&Math.abs(lx-12-Math.sin(ly*.4)*5)<.9)return glow?rgb(200,60,14):rgb(b[0]*.35,b[1]*.3,b[2]*.3);
  if(hash(bx,by,seed+4)<.15&&Math.hypot(lx-20,ly-18)<6+R()*2)return rgb(90+n,8,6);
  return rgb((b[0]+v+n)*k,(b[1]+v*.6+n*.7)*k,(b[2]+v*.5+n*.6)*k);},seed);}
function ceilTex(b,seed){return makeTex((x,y,R)=>{const n=R()*14;if((x&31)<3)return rgb(b[0]*.5,b[1]*.5,b[2]*.5);if((y&15)===0)return rgb(b[0]*.7,b[1]*.7,b[2]*.7);return rgb(b[0]+n,b[1]+n*.5,b[2]+n*.4);},seed);}
const THEMES=[
  {name:'Brána pekla',wall:brickTex([112,36,26],[30,12,10],11),alt:fleshTex(12),floor:floorTex([66,44,38],13,true),ceil:ceilTex([36,18,15],14),fog:[26,4,2]},
  {name:'Masité chodby',wall:fleshTex(21),alt:brickTex([90,30,40],[30,8,12],22),floor:floorTex([80,30,32],23,false),ceil:ceilTex([40,10,14],24),fog:[30,2,10]},
  {name:'Obsidiánová hlubina',wall:obsTex(31),alt:brickTex([60,40,80],[14,8,20],32),floor:floorTex([34,24,44],33,true),ceil:ceilTex([14,8,20],34),fog:[10,2,18]}];
let TH=THEMES[0],wallTex=[],FR=26,FG=4,FB=2;
function setTheme(i){TH=THEMES[i%3];wallTex=[null,TH.wall,TH.alt,texLava,texDoor];[FR,FG,FB]=TH.fog;}
function shade(c,f){const nf=1-f;return 0xff000000|((((c>>16)&255)*f+FB*nf)<<16)|((((c>>8)&255)*f+FG*nf)<<8)|((c&255)*f+FR*nf);}
let LB=0,camZ=.5;
const fogF=d=>Math.min(1,(d<1?1:Math.max(.1,1-(d-1)/12))*(1+LB));

/* ---------- mapa: kruh z místností ---------- */
const CELL=12,GX=4,GY=4;
let MW=GX*CELL,MH=GY*CELL,map=new Uint8Array(MW*MH),flow=new Int16Array(MW*MH),q=new Int32Array(MW*MH),seen=new Uint8Array(MW*MH),rooms=[],curRoom=null,portal=null,mmDirty=true;
const solid=(x,y)=>x<0||y<0||x>=MW||y>=MH||map[(y|0)*MW+(x|0)]!==0;
const free=(x,y,r)=>!solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r);
function tryMove(o,dx,dy,r){if(free(o.x+dx,o.y,r))o.x+=dx;if(free(o.x,o.y+dy,r))o.y+=dy;}
function hasLOS(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/.25);for(let i=1;i<n;i++)if(solid(x0+dx*i/n,y0+dy*i/n))return false;return true;}
function genFloor(){
  let path;
  do{path=[[Math.random()*GX|0,Math.random()*GY|0]];const used=new Set([path[0].join()]),n=Math.min(9,5+depth);
    while(path.length<n){const[cx,cy]=path[path.length-1];const o=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[cx+a,cy+b]).filter(([x,y])=>x>=0&&y>=0&&x<GX&&y<GY&&!used.has(x+','+y));
      if(!o.length)break;const c=o[Math.random()*o.length|0];path.push(c);used.add(c.join());}}while(path.length<5);
  map.fill(1);seen.fill(0);rooms=[];curRoom=null;portal=null;mmDirty=true;
  path.forEach(([cx,cy],i)=>{const w=7+(Math.random()*3|0),h=7+(Math.random()*3|0),x0=cx*CELL+1+(Math.random()*(11-w)|0),y0=cy*CELL+1+(Math.random()*(11-h)|0);
    const r={idx:i,cx,cy,x0,y0,x1:x0+w-1,y1:y0+h-1,type:'fight',cleared:false,visited:false,alarm:false,doors:[],wave:0,waves:Math.min(4,1+Math.floor(depth/2)),hadElite:false};
    for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++)map[y*MW+x]=0;rooms.push(r);});
  for(let i=1;i<path.length;i++){const[ax,ay]=path[i-1],[bx,by]=path[i];
    if(ay===by){const y=ay*CELL+5;for(let x=Math.min(ax,bx)*CELL+6;x<=Math.max(ax,bx)*CELL+6;x++){map[y*MW+x]=0;map[(y+1)*MW+x]=0;}}
    else{const x=ax*CELL+5;for(let y=Math.min(ay,by)*CELL+6;y<=Math.max(ay,by)*CELL+6;y++){map[y*MW+x]=0;map[y*MW+x+1]=0;}}}
  rooms[0].type='start';rooms[0].cleared=true;const last=rooms[rooms.length-1];last.type='boss';last.waves=depth>1?2:1;
  const alt=1+(Math.random()*(rooms.length-2)|0);if(rooms.length>=5){rooms[alt].type='altar';rooms[alt].cleared=true;}
  for(const r of rooms){
    for(let x=r.x0-1;x<=r.x1+1;x++)for(const y of[r.y0-1,r.y1+1])if(!map[y*MW+x])r.doors.push(y*MW+x);
    for(let y=r.y0;y<=r.y1;y++)for(const x of[r.x0-1,r.x1+1])if(!map[y*MW+x])r.doors.push(y*MW+x);
    if(r.type==='fight'||r.type==='boss'){const np=1+(Math.random()*3|0);
      for(let k=0;k<np;k++){const s=Math.random()<.4?2:1,x=r.x0+2+(Math.random()*(r.x1-r.x0-3-s)|0),y=r.y0+2+(Math.random()*(r.y1-r.y0-3-s)|0);
        const rx=x-r.cx*CELL,ry=y-r.cy*CELL;if(rx+s>=4&&rx<=7)continue;if(ry+s>=4&&ry<=7)continue;
        const t=Math.random()<.5?3:2;for(let yy=y;yy<y+s;yy++)for(let xx=x;xx<x+s;xx++)map[yy*MW+xx]=t;}}}
}
const roomAt=(x,y,m)=>rooms.find(r=>x>=r.x0+m&&x<=r.x1+1-m&&y>=r.y0+m&&y<=r.y1+1-m)||null;
const rc=r=>[(r.x0+r.x1+1)/2,(r.y0+r.y1+1)/2];
function markSeen(r){for(let y=r.y0-1;y<=r.y1+1;y++)for(let x=r.x0-1;x<=r.x1+1;x++)seen[y*MW+x]=1;mmDirty=true;}

/* ---------- sprity ---------- */
function outline(g,w,h){const d=g.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(a[i+3]>100)continue;
    if((x>0&&a[i-1]>100)||(x<w-1&&a[i+7]>100)||(y>0&&a[i-w*4+3]>100)||(y<h-1&&a[i+w*4+3]>100)){o[i]=12;o[i+1]=6;o[i+2]=6;o[i+3]=255;}}
  d.data.set(o);g.putImageData(d,0,0);}
function spr(w,h,draw,ol){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g);if(ol)outline(g,w,h);return{w,h,d:new Uint32Array(g.getImageData(0,0,w,h).data.buffer),canvas:c};}
const mirror=s=>spr(s.w,s.h,g=>{g.scale(-1,1);g.drawImage(s.canvas,-s.w,0);});
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
const E=(g,c,x,y,rx,ry)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();};
function marine(p,view,fr,flash,kind){return spr(56,80,g=>{
  const D=p.dark,A=p.armor,L=p.light,K='#151515',B='#4a3018',BL='#6a4828',M='#3a3a3a',SK='#c8916a';
  if(view==='side'){
    if(kind==='elite'){R(g,'#7a0a0a',11,26,8,34);R(g,'#a81616',12,26,3,32);}
    for(const[lx,o]of fr?[[21,-5],[29,5]]:[[24,-1],[27,1]]){R(g,D,lx,50,8,12);R(g,A,lx+1,50,6,10);R(g,L,lx,58,8,4);R(g,D,lx+o,62,7,10);R(g,A,lx+o+1,62,3,9);R(g,K,lx+o-1,71,11,7);R(g,'#2e2e2e',lx+o-1,71,11,1);R(g,'#000',lx+o-1,77,11,2);}
    R(g,D,12,25,10,21);R(g,kind==='cross'?'#e8e8e8':'#4a4030',13,26,8,19);R(g,'#2a2418',13,34,8,2);R(g,'#6a5a40',13,26,2,19);
    if(kind==='cross'){R(g,'#d82020',16,29,3,10);R(g,'#d82020',14,32,7,3);}
    if(kind==='heavy'){R(g,'#222',14,4,1,22);R(g,'#f22',13,3,3,2);}

  }

  else if(mood==='angry'){R(g,M,12,34,16,4);R(g,TT,12.5,34.5,15,1.4);R(g,TT,12.5,36.4,15,1.2);for(let i=0;i<5;i++)R(g,M,14+i*3,34.5,.8,3.2);}

  else if(mood==='cast'){E(g,M,20,36,3,2.4);E(g,p.magic,20,36,1.6,1.2);}
  else if(mood==='sly'){g.strokeStyle=M;g.lineWidth=1.6;g.beginPath();g.moveTo(13,36);g.quadraticCurveTo(20,37.5,27,33.5);g.stroke();g.fillStyle=TT;tri(g,24,35,26,34.4,25.4,37);}
  else if(tier>=3){g.strokeStyle=M;g.lineWidth=1.6;g.beginPath();g.moveTo(12,37);for(let i=1;i<=6;i++)g.lineTo(12+i*2.7,37+(i%2?-1.4:0));g.stroke();}
  else{g.strokeStyle=M;g.lineWidth=1.8;g.beginPath();g.moveTo(12,35);g.quadraticCurveTo(20,39,28,34);g.stroke();g.fillStyle=TT;tri(g,14,35.6,16,36.2,15,38.6);tri(g,25,35.4,27,34.8,26.2,37.6);}
  if(tier>=2){R(g,'#7a0000',25,15,1.6,6);R(g,'#7a0000',25.5,21,1,2);}
  if(tier>=3){E(g,'#3a1030',11.5,27,3,2.2);R(g,'#8a0000',12,14,1.6,8);R(g,'#7a0000',29.5,31,1.2,5);}
  if(tier>=4){R(g,'#9a0000',16,13,2,10);E(g,'#5a0010',29,37,2,1.5);R(g,'#9a0000',8,30,1.4,6);}
  if(mood==='cast'){g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(20,26,0,20,26,14);gr.addColorStop(0,p.magic+'66');gr.addColorStop(1,p.magic+'00');g.fillStyle=gr;g.fillRect(0,0,40,46);g.globalCompositeOperation='source-over';}
}

/* ---------- spodní lišta ---------- */
function drawBar(){const s=DPR,cw=cv.width,ch=cv.height,by=VH*DPR,bh=ch-by,pad=Math.round(bh*.1),ih=bh-pad*2;
  const gr=ctx.createLinearGradient(0,by,0,ch);gr.addColorStop(0,'#3a1408');gr.addColorStop(1,'#140403');ctx.fillStyle=gr;ctx.fillRect(0,by,cw,bh);
  ctx.fillStyle='#ff6a1a';ctx.fillRect(0,by,cw,2*s);ctx.fillStyle='#000';ctx.fillRect(0,by+2*s,cw,2*s);
  const panel=(x,w)=>{ctx.fillStyle='#120403';ctx.fillRect(x,by+pad,w,ih);ctx.strokeStyle='#6a2410';ctx.lineWidth=2*s;ctx.strokeRect(x+s,by+pad+s,w-2*s,ih-2*s);
    ctx.fillStyle='#9a4a20';for(const[rx,ry]of[[x+4*s,by+pad+4*s],[x+w-6*s,by+pad+4*s],[x+4*s,by+bh-pad-6*s],[x+w-6*s,by+bh-pad-6*s]])ctx.fillRect(rx,ry,2*s,2*s);};
  const big=Math.round(bh*.25),lab=Math.round(bh*.19);
  const stat=(x,w,val,col,label,frac,fc)=>{panel(x,w);ctx.textAlign='center';ctx.font=`${big}px "Press Start 2P",monospace`;ctx.fillStyle='#000';ctx.fillText(val,x+w/2+2*s,by+pad+ih*.52+2*s);ctx.fillStyle=col;ctx.fillText(val,x+w/2,by+pad+ih*.52);
    ctx.font=`${lab}px VT323,monospace`;ctx.fillStyle='#c98d78';ctx.fillText(label,x+w/2,by+pad+ih*.92);
    if(frac!=null){ctx.fillStyle='#000';ctx.fillRect(x+6*s,by+pad+ih*.62,w-12*s,4*s);ctx.fillStyle=fc;ctx.fillRect(x+6*s,by+pad+ih*.62,(w-12*s)*Math.max(0,Math.min(1,frac)),4*s);}};
  const fh=bh*1.2,fw=fh*40/46,fx=cw/2-fw/2,fy=ch-fh-4*s,gap=pad*.7+8*s,sw=bh*1.45;let x=pad;
  stat(x,sw,Math.max(0,Math.ceil(P.hp)),P.hp<P.maxHp*.3&&(T*4|0)%2?'#ffd0a0':'#ff3a20','ZDRAVÍ',P.hp/P.maxHp,'#d8202a');x+=sw+gap;
  if(x+sw*.9<fx-gap){stat(x,sw*.9,runSouls,'#5ff0ff','DUŠE');x+=sw*.9+gap;}
  if(x+sw*.9<fx-gap)stat(x,sw*.9,kills,'#ffd0a0','ZABITO');
  {const fr=6*s,x0=fx-fr,y0=fy-fr,w0=fw+fr*2,h0=fh+fr,rad=14*s;
    ctx.beginPath();ctx.moveTo(x0,ch);ctx.lineTo(x0,y0+rad);ctx.quadraticCurveTo(x0,y0,x0+rad,y0);ctx.lineTo(x0+w0-rad,y0);ctx.quadraticCurveTo(x0+w0,y0,x0+w0,y0+rad);ctx.lineTo(x0+w0,ch);ctx.closePath();
    const fg2=ctx.createLinearGradient(0,y0,0,ch);fg2.addColorStop(0,'#4a1a0a');fg2.addColorStop(1,'#140403');ctx.fillStyle=fg2;ctx.fill();
    ctx.lineWidth=3*s;ctx.strokeStyle='#ff6a1a';ctx.stroke();ctx.lineWidth=1.5*s;ctx.strokeStyle='#000';ctx.strokeRect(fx-1,fy-1,fw+2,fh+2);
    ctx.fillStyle='#120403';ctx.fillRect(fx,fy,fw,fh);
    drawFace();ctx.imageSmoothingEnabled=false;ctx.drawImage(faceC,fx,fy,fw,fh);
    if(face.hurtT>0){ctx.fillStyle=`rgba(255,0,0,${Math.min(.35,face.hurtT*.4)})`;ctx.fillRect(fx,fy,fw,fh);}}
  let rx=fx+fw+gap;const lw=bh*1.7,right=cw-(isTouch?BAR*DPR*3.05:pad);
  if(rx+lw<=right){panel(rx,lw);ctx.textAlign='center';ctx.font=`${Math.round(bh*.17)}px "Press Start 2P",monospace`;ctx.fillStyle='#ffb36b';ctx.fillText(STAGES[stageIdx()][1].toUpperCase(),rx+lw/2,by+pad+ih*.32);
    ctx.font=`${lab}px VT323,monospace`;ctx.fillStyle='#c98d78';ctx.fillText(`úroveň ${P.lvl}`,rx+lw/2,by+pad+ih*.56);
    ctx.fillStyle='#000';ctx.fillRect(rx+6*s,by+pad+ih*.63,lw-12*s,5*s);ctx.fillStyle='#3fd8ff';ctx.fillRect(rx+6*s,by+pad+ih*.63,(lw-12*s)*P.xp/need(),5*s);
    if(pendingLv>0){ctx.fillStyle=`rgba(255,120,255,${.7+.3*Math.sin(T*5)})`;ctx.fillText(`mutace po boji: ${pendingLv}`,rx+lw/2,by+pad+ih*.93);}
    rx+=lw+gap;}
  if(!isTouch){const aw=bh*1.2;
    const slot=(name,key,cd,max,col)=>{if(rx+aw>right)return;panel(rx,aw);const rdy=cd<=0;
      if(!rdy){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(rx+2*s,by+pad+2*s,aw-4*s,(ih-4*s)*cd/max);}
      ctx.textAlign='center';ctx.font=`${Math.round(bh*.12)}px "Press Start 2P",monospace`;ctx.fillStyle=rdy?col:'#7a5a50';ctx.fillText(name,rx+aw/2,by+pad+ih*.45);
      ctx.font=`${lab}px VT323,monospace`;ctx.fillStyle='#c98d78';ctx.fillText(rdy?key:cd.toFixed(1).replace('.',',')+' s',rx+aw/2,by+pad+ih*.82);rx+=aw+gap;};
    slot('DRÁPY','LMB nebo F',P.clawCd,.42,'#ffb36b');slot('PENTAGRAM','RMB nebo Q',P.pentCd,P.pentCdMax,'#e080ff');}
}

const mmC=document.createElement('canvas'),mmX=mmC.getContext('2d');
function drawMinimap(){mmC.width=MW*3;mmC.height=MH*3;mmX.clearRect(0,0,mmC.width,mmC.height);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(!seen[y*MW+x])continue;const t=map[y*MW+x];
    mmX.fillStyle=t===0?'#5a2418':t===4?'#ff7a1a':t===3?'#c04010':'#1e0a06';mmX.fillRect(x*3,y*3,3,3);}
  for(const r of rooms)if(r.visited&&r.type==='altar'&&souls.some(s=>s.big)){const[x,y]=rc(r);mmX.fillStyle='#ff40ff';mmX.fillRect(x*3-3,y*3-3,6,6);}
  mmDirty=false;}
function bar(x,y,w,h,v,col,label){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x+2,y+2,(w-4)*Math.max(0,Math.min(1,v)),h-4);
  if(label){ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(label,x+8,y+h*.78);}}
const fightRooms=()=>rooms.filter(r=>r.type==='fight'||r.type==='boss');
const roomsClearedOnFloor=()=>fightRooms().filter(r=>r.cleared).length;
function drawHUD(){
  const s=DPR,cw=cv.width,ch=VH*DPR,sx=cw/W,sy=ch/H;
  if(state==='menu')return;
  drawPents(s,sx,sy);
  if(P.crouch){const g=ctx.createRadialGradient(cw/2,ch/2,ch*.25,cw/2,ch/2,ch*.85);g.addColorStop(0,'rgba(10,0,20,0)');g.addColorStop(1,'rgba(20,0,40,.7)');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);}
  if(P.aura){const g=ctx.createRadialGradient(cw/2,ch/2,ch*.3,cw/2,ch/2,ch*.9);g.addColorStop(0,'rgba(255,90,0,0)');g.addColorStop(1,`rgba(255,90,0,${.18+.06*Math.sin(T*6)})`);ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);}
  if(P.hp<P.maxHp*.3){const g=ctx.createRadialGradient(cw/2,ch/2,ch*.25,cw/2,ch/2,ch*.85);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,`rgba(160,0,0,${.35+.15*Math.sin(T*8)})`);ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);}
  if(hurtFlash>0){ctx.fillStyle=`rgba(255,0,0,${hurtFlash*.9})`;ctx.fillRect(0,0,cw,ch);}
  if(tRect){const x0=tRect.x*sx-tRect.w*sx/2-4*s,x1=x0+tRect.w*sx+8*s,y0=tRect.top*sy-4*s,y1=tRect.bottom*sy,L=8*s;
    ctx.strokeStyle=P.crouch?'rgba(200,140,255,.9)':'rgba(255,170,60,.9)';ctx.lineWidth=2*s;ctx.beginPath();
    ctx.moveTo(x0,y0+L);ctx.lineTo(x0,y0);ctx.lineTo(x0+L,y0);ctx.moveTo(x1-L,y0);ctx.lineTo(x1,y0);ctx.lineTo(x1,y0+L);
    ctx.moveTo(x0,y1-L);ctx.lineTo(x0,y1);ctx.lineTo(x0+L,y1);ctx.moveTo(x1-L,y1);ctx.lineTo(x1,y1);ctx.lineTo(x1,y1-L);ctx.stroke();}
  ctx.textAlign='center';
  for(const e of enemies){if(e.alert&&e.alertT<=0)continue;if(!e.alert&&e.aware<.05)continue;const p=project(e.x,e.y,e.size+.12);if(!p)continue;
    const k=Math.min(1.3,Math.max(.6,3/p.d))*s;
    if(e.alert){ctx.font=`${34*k}px "Press Start 2P",monospace`;ctx.fillStyle='#000';ctx.fillText('!',p.x*sx+2*s,p.y*sy+2*s);ctx.fillStyle='#ff3020';ctx.fillText('!',p.x*sx,p.y*sy);}
    else{ctx.lineWidth=3*k;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.arc(p.x*sx,p.y*sy-10*k,9*k,0,7);ctx.stroke();
      ctx.strokeStyle=e.aware>.6?'#ff7a1a':'#ffd040';ctx.beginPath();ctx.arc(p.x*sx,p.y*sy-10*k,9*k,-1.57,-1.57+e.aware*6.283);ctx.stroke();
      ctx.font=`${20*k}px VT323,monospace`;ctx.fillStyle='#ffd040';ctx.fillText('?',p.x*sx,p.y*sy-4*k);}}
  for(const n of nums){const p=project(n.x,n.y,n.z);if(!p)continue;const a=Math.min(1,n.t*2.5),sn=n.kind==='sneak';
    ctx.font=`${(sn?34:n.kind==='crit'?30:20)*s*Math.min(1.4,Math.max(.6,3/p.d))}px VT323,monospace`;
    ctx.fillStyle=`rgba(0,0,0,${a*.7})`;ctx.fillText(n.v,p.x*sx+2*s,p.y*sy+2*s);
    if(n.kind==='hell'){ctx.font=`${30*s}px "Press Start 2P",monospace`;ctx.fillStyle=`rgba(255,60,30,${a})`;ctx.fillText(n.v,p.x*sx,p.y*sy);continue;}
    ctx.fillStyle=sn?`rgba(210,120,255,${a})`:n.kind==='crit'?`rgba(255,220,60,${a})`:`rgba(255,255,255,${a})`;ctx.fillText(n.v,p.x*sx,p.y*sy);
    if(sn){ctx.font=`${18*s}px VT323,monospace`;ctx.fillText('ZE STÍNU',p.x*sx,p.y*sy-26*s);}}
  const m=12*s;
  ctx.textAlign='center';ctx.font=`${26*s}px VT323,monospace`;ctx.fillStyle='#fff';ctx.fillText(`KRUH ${depth}`,cw/2,m+70*s);
  ctx.font=`${19*s}px VT323,monospace`;ctx.fillStyle='#ff8a5a';
  if(boss&&!boss.dead){const w=Math.min(420*s,cw*.5);bar(cw/2-w/2,m+80*s,w,20*s,boss.hp/boss.maxHp,'#ff7a1a','HRDINA');}
  else ctx.fillText(portal?'Vstup do portálu':curRoom?`Posily ${curRoom.wave} / ${curRoom.waves}`:`Vyčištěno ${roomsClearedOnFloor()} / ${fightRooms().length} místností · jdi dál`,cw/2,m+90*s);
  if(mmDirty)drawMinimap();
  const mm=Math.min(130*s,cw*.2),c=mm/MW,mx0=cw-m-mm,my0=m;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(mx0,my0,mm,mm);ctx.imageSmoothingEnabled=false;ctx.drawImage(mmC,mx0,my0,mm,mm);
  if(portal){ctx.fillStyle=`rgba(180,120,255,${.6+.4*Math.sin(T*6)})`;ctx.beginPath();ctx.arc(mx0+portal.x*c,my0+portal.y*c,4*s,0,7);ctx.fill();}
  for(const e of enemies){if(!seen[(e.y|0)*MW+(e.x|0)])continue;ctx.fillStyle=!e.alert?'#ffd040':{boss:'#ffd040',elite:'#ff40ff',medic:'#ffffff',runner:'#ffa020'}[e.type]||'#ff3030';const r=(e.type==='boss'||e.type==='elite'?2.6:1.4)*s;ctx.fillRect(mx0+e.x*c-r,my0+e.y*c-r,r*2,r*2);}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx0+P.x*c,my0+P.y*c,2.5*s,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(mx0+P.x*c,my0+P.y*c);ctx.lineTo(mx0+(P.x+Math.cos(P.a)*3)*c,my0+(P.y+Math.sin(P.a)*3)*c);ctx.stroke();
  if(combo>=5){const k=Math.min(1.6,1+combo/60),a=Math.min(1,comboT);ctx.textAlign='right';ctx.font=`${28*k*s}px "Press Start 2P",monospace`;
    ctx.fillStyle=`rgba(255,${combo>=15?80:160},40,${a})`;ctx.fillText(`×${combo}`,cw-m,ch*.58);
    ctx.font=`${18*s}px VT323,monospace`;ctx.fillText(combo>=15?'COMBO · duše navíc':'COMBO',cw-m,ch*.58+24*s);}
  if(P.crouch){ctx.textAlign='center';ctx.font=`${22*s}px VT323,monospace`;ctx.fillStyle='rgba(220,180,255,.9)';ctx.fillText('PLÍŽÍŠ SE · koule nelétají, drápy ano',cw/2,ch-22*s);}
  if(bannerT>0){ctx.textAlign='center';ctx.font=`${Math.min(38*s,cw/18)}px "Press Start 2P",monospace`;const a=Math.min(1,bannerT);
    ctx.fillStyle=`rgba(40,0,0,${a*.8})`;ctx.fillText(banner,cw/2+4*s,ch*.47+4*s);ctx.fillStyle=`rgba(255,90,30,${a})`;ctx.fillText(banner,cw/2,ch*.47);
    if(bannerSub){ctx.font=`${28*s}px VT323,monospace`;ctx.fillStyle=`rgba(255,200,160,${a})`;ctx.fillText(bannerSub,cw/2,ch*.47+38*s);}}
  if(moveT){ctx.strokeStyle='rgba(255,180,120,.5)';ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(moveT.sx*s,moveT.sy*s,55*s,0,7);ctx.stroke();
    let dx=moveT.x-moveT.sx,dy=moveT.y-moveT.sy;const l=Math.hypot(dx,dy);if(l>55){dx*=55/l;dy*=55/l;}
    ctx.fillStyle='rgba(255,140,80,.55)';ctx.beginPath();ctx.arc((moveT.sx+dx)*s,(moveT.sy+dy)*s,22*s,0,7);ctx.fill();}
}

/* ---------- smyčka ---------- */
reset(true);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);else if(state==='menu'){P.a+=dt*.15;T+=dt;}
  render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
}
</script>
