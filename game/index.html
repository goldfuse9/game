<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IMP 2 — Temné patro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: temná gotická pixelová hra, pohled shora
   IDEA: imp čaroděj se plíží temným peklem, mariňáci svítí baterkami
   PICTURE: samotná hra přes celou obrazovku, světlo jen kolem ohně
   COLOUR and TYPE: černá tma, rezavá červeň, oranžový oheň, azurové duše; Press Start 2P + VT323
   LAYOUT: plátno přes celé okno, akce dole, portrét vlevo nahoře, mapa vpravo */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:VT323,ui-monospace,monospace;color:#fff}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(40,4,0,.86),rgba(4,0,0,.96));text-align:center;padding:20px;overflow:auto}
.hidden{display:none!important}
h1{font-family:"Press Start 2P",monospace;font-size:clamp(40px,11vw,96px);margin:0;color:#ff5a1f;text-shadow:0 0 28px #ff2a00,5px 5px 0 #3a0400;line-height:1.05}
h1 small{display:block;font-size:.28em;color:#c98d78;text-shadow:none;margin-top:12px;letter-spacing:.05em}
h2{font-family:"Press Start 2P",monospace;font-size:clamp(18px,4vw,30px);margin:0;color:#ffb36b;text-shadow:3px 3px 0 #3a0400;line-height:1.3}
p{font-size:clamp(20px,2.6vw,26px);margin:0;max-width:30em;line-height:1.15;color:#f3d6c8}
.dim{color:#c98d78;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button.big{font-family:"Press Start 2P",monospace;font-size:clamp(14px,2.6vw,20px);padding:18px 30px;min-height:44px;background:#ff5a1f;color:#1a0200;border:0;border-radius:6px;box-shadow:0 5px 0 #8a1f00,0 0 30px rgba(255,80,0,.5);cursor:pointer;margin-top:8px}
button.big.alt{background:#2a0805;color:#5ff0ff;border:2px solid #3fd8ff;box-shadow:0 5px 0 #0a3a48}
button.big:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid #5ff0ff;outline-offset:3px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:980px}
.card{flex:1 1 150px;max-width:230px;background:#2a0805;border:2px solid #ff6a2a;border-radius:10px;padding:12px;color:#fff;cursor:pointer;font:inherit;text-align:left;box-shadow:0 0 18px rgba(255,90,20,.25)}
.card:hover:not(:disabled){background:#3d0d07;transform:translateY(-2px)}
.card:disabled{opacity:.45;cursor:default}
.card .k{float:right;color:#ff6a2a;font-size:18px}
.card .rar{display:block;font-size:17px;margin-bottom:2px}
.card b{display:block;margin:2px 0 6px;color:#ffb36b;font-size:23px;font-weight:400;line-height:1}
.card span{font-size:19px;line-height:1.1;color:#f3d6c8}
.card small{display:block;margin-top:8px;color:#c98d78;font-size:17px}
.card .cost{color:#5ff0ff}
.dots{letter-spacing:2px;color:#ff6a2a}
.tbtn{position:fixed;width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,140,80,.6);background:rgba(20,2,0,.7);color:#ffb36b;font-family:"Press Start 2P",monospace;font-size:12px;cursor:pointer;z-index:2}
#actions{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.55) 70%,transparent);z-index:2}
.abtn{width:min(31vw,116px);height:62px;border-radius:10px;border:2px solid rgba(255,140,80,.7);color:#ffd0a0;font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.5;cursor:pointer;touch-action:none;background:linear-gradient(to top,rgba(150,40,10,.92) var(--rdy,100%),rgba(14,2,0,.9) var(--rdy,100%))}
.abtn small{display:block;font-family:VT323,monospace;font-size:16px;color:#c98d78}
#pentBtn{border-color:#c060ff;color:#f0d0ff;background:linear-gradient(to top,rgba(110,20,150,.92) var(--rdy,100%),rgba(14,2,0,.9) var(--rdy,100%))}
#crouchBtn{background:rgba(14,2,0,.9)}
#splitBtn{border-color:#9a7aff;color:#e0d8ff;background:linear-gradient(to top,rgba(70,40,160,.92) var(--rdy,100%),rgba(14,2,0,.9) var(--rdy,100%))}
#splitBtn.active{box-shadow:0 0 18px #a070ff;border-color:#e0c0ff}
@media (orientation:landscape) and (pointer:coarse){#actions{left:auto;right:0;bottom:0;flex-direction:column;align-items:flex-end;gap:6px;padding:8px calc(8px + env(safe-area-inset-right)) 8px 8px;background:linear-gradient(to left,rgba(0,0,0,.85),transparent)}.abtn{width:108px;height:44px;font-size:9px}}
@media (pointer:fine){.abtn{width:118px;height:56px}}
canvas.play{cursor:none}
#crouchBtn.on{background:rgba(80,20,120,.9);border-color:#c080ff;color:#e8d0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="tbtn hidden" aria-label="Pauza">II</button>
<button id="musicBtn" class="tbtn hidden" aria-label="Hudba">♪</button>
<div id="actions" class="hidden">
  <button id="crouchBtn" class="abtn" aria-label="Plížení">PLÍŽIT<small class="kh">C</small></button>
  <button id="clawBtn" class="abtn" aria-label="Drápy">DRÁPY<small class="kh">F · LMB</small></button>
  <button id="pentBtn" class="abtn" aria-label="Pentagram">PENTAGRAM<small class="kh">Q · RMB</small></button>
  <button id="splitBtn" class="abtn" aria-label="Rozpolcená duše"><span id="splitLbl">DUŠE ×1</span><small class="kh">E</small></button>
</div>

<div id="start" class="ov">
  <h1>IMP<small>TEMNÉ PATRO</small></h1>
  <p>Mariňáci s baterkami pročesávají peklo. Ty jsi jen malý imp čaroděj ve tmě.</p>
  <p>Vyhýbej se kuželům světla, rozsekej stráže zezadu, nebo je stáhni pentagramem do pekla. Před Hrdinou rozpolť duši na dva klony.</p>
  <p class="dim" id="ctrlHint"></p>
  <div class="row"><button class="big" id="playBtn">HRÁT</button><button class="big alt shopBtn">POKLADNICE</button></div>
  <p class="dim" id="best"></p>
</div>
<div id="lvl" class="ov hidden"><h2 id="lvlTitle">MUTACE!</h2><p class="dim" id="lvlSub"></p><div class="cards" id="cards"></div></div>
<div id="shop" class="ov hidden"><h2>PEKELNÁ POKLADNICE</h2><p id="bank"></p><div class="cards" id="shopCards"></div><button class="big" id="shopBack">ZPĚT</button></div>
<div id="pause" class="ov hidden"><h2>PAUZA</h2><button class="big" id="resumeBtn">POKRAČOVAT</button></div>
<div id="end" class="ov hidden"><h2 id="endTitle"></h2><p id="endStats"></p><p id="endSouls" style="color:#5ff0ff"></p>
  <div class="row"><button class="big" id="againBtn">ZNOVU</button><button class="big alt shopBtn">POKLADNICE</button></div></div>

<script>
{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const low=document.createElement('canvas'),lg=low.getContext('2d');
const lit=document.createElement('canvas'),lc=lit.getContext('2d');
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
let S=2,LW=192,LH=400,DPR=1,OX=0,OY=0;
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);const cw=innerWidth,ch=innerHeight;
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  const SD=Math.max(1,Math.round(Math.min(cv.width,cv.height)/((cw>ch?10:8.5)*32)));S=2*SD/DPR;
  LW=Math.ceil(cv.width/(2*SD));LH=Math.ceil(cv.height/(2*SD));low.width=LW*2;low.height=LH*2;lit.width=LW*2;lit.height=LH*2;
  const mm=Math.min(110,cw*.27);$('musicBtn').style.cssText=`top:${mm+18}px;right:8px`;$('pauseBtn').style.cssText=`top:${mm+18}px;right:56px`;}
addEventListener('resize',resize);resize();

let META={bank:0,up:{},bestDepth:0,music:true};
try{Object.assign(META,JSON.parse(localStorage.getItem('imp2-meta')||'{}'));}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('imp2-meta',JSON.stringify(META));}catch(e){}};

/* ---------- pomocné kreslení ---------- */
function rng(s){s>>>=0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c;}
const col=(a,k)=>`rgb(${a[0]*k|0},${a[1]*k|0},${a[2]*k|0})`;
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w===undefined?1:w,h===undefined?1:h);};
const E=(g,c,x,y,rx,ry)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();};
function outlineC(c){const w=c.width,h=c.height;return mk(w,h,g=>{g.drawImage(c,0,0);const d=g.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(a[i+3]>100)continue;
    if((x>0&&a[i-1]>100)||(x<w-1&&a[i+7]>100)||(y>0&&a[i-w*4+3]>100)||(y<h-1&&a[i+w*4+3]>100)){o[i]=8;o[i+1]=2;o[i+2]=2;o[i+3]=255;}}
  d.data.set(o);g.putImageData(d,0,0);});}
const whiteOf=c=>mk(c.width,c.height,g=>{g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);});
const flipOf=c=>mk(c.width,c.height,g=>{g.scale(-1,1);g.drawImage(c,-c.width,0);});
const spr=(w,h,fn)=>{const c=outlineC(mk(w,h,fn));return{c,w:whiteOf(c)};};

/* ---------- dlaždice podle kruhu ---------- */
const THEMES=[
  {name:'Brána pekla',floor:[52,40,36],wall:[104,38,28],alt:[120,40,50],glow:'#c0400c',amb:.9,blood:'#4a0404'},
  {name:'Masité chodby',floor:[60,24,28],wall:[140,44,54],alt:[96,32,28],glow:null,amb:.92,blood:'#3a0206'},
  {name:'Obsidiánová hlubina',floor:[26,20,34],wall:[38,26,56],alt:[60,40,80],glow:'#ff46d2',amb:.93,blood:'#3a0420'}];
function makeTheme(th,seed){const Rn=rng(seed),b=th.floor;
  const floors=[0,1,2,3].map(v=>mk(16,16,g=>{R(g,col(b,1),0,0,16,16);
    for(let i=0;i<46;i++)R(g,col(b,.7+Rn()*.5),Rn()*16|0,Rn()*16|0);
    R(g,col(b,.45),0,0,16,1);R(g,col(b,.45),0,0,1,16);R(g,col(b,1.25),1,1,15,1);
    if(v===1){let x=3+Rn()*8|0,y=2;for(let i=0;i<10;i++){R(g,col(b,.4),x,y);x+=Rn()<.5?1:-1;y++;if(x<1||x>15)break;}}
    if(v===2)for(let i=0;i<9;i++)R(g,th.blood,6+Rn()*6|0,6+Rn()*5|0,2,1);
    if(v===3&&th.glow){R(g,th.glow,4,7,5,1);R(g,th.glow,8,8,1,3);R(g,th.glow,8,10,4,1);}}));
  const wall=(w)=>({top:mk(16,16,g=>{R(g,col(w,.42),0,0,16,16);for(let i=0;i<30;i++)R(g,col(w,.3+Rn()*.25),Rn()*16|0,Rn()*16|0);R(g,col(w,.6),0,15,16,1);R(g,col(w,.22),0,0,16,1);}),
    front:mk(16,12,g=>{R(g,col(w,.28),0,0,16,12);for(let r=0;r<3;r++){const off=(r%2)*4;for(let bx=-4;bx<16;bx+=8){const k=.75-r*.14+Rn()*.12;R(g,col(w,k),bx+off+1,r*4+1,7,3);R(g,col(w,k*1.25),bx+off+1,r*4+1,7,1);}}
      R(g,'rgba(0,0,0,.5)',0,10,16,2);for(let i=0;i<3;i++){if(Rn()<.5){const x=Rn()*16|0;R(g,th.blood,x,2+Rn()*3|0,1,3+Rn()*6|0);}}})});
  return{floors,w1:wall(th.wall),w2:wall(th.alt)};}
const TILES=THEMES.map((t,i)=>makeTheme(t,11+i*7));
const LAVA={top:mk(16,16,g=>{R(g,'#2a1008',0,0,16,16);const Rn=rng(3);for(let i=0;i<5;i++){let x=Rn()*16|0,y=Rn()*16|0;for(let j=0;j<7;j++){R(g,j%3?'#ff7a1a':'#ffd060',x,y);x+=Rn()<.5?1:0;y+=Rn()<.5?1:-1;}}R(g,'#5a2010',0,15,16,1);}),
  front:mk(16,12,g=>{R(g,'#1a0804',0,0,16,12);R(g,'#ff5a10',3,0,1,12);R(g,'#ffb040',4,3,1,5);R(g,'#ff5a10',11,2,1,10);R(g,'#ffd060',12,5,1,3);R(g,'rgba(0,0,0,.5)',0,10,16,2);})};
const DOOR={top:mk(16,16,g=>{R(g,'#1c1c22',0,0,16,16);for(let x=1;x<16;x+=3)R(g,'#3a3a44',x,0,1,16);R(g,'#5a5a66',0,15,16,1);}),
  front:mk(16,12,g=>{R(g,'#c02808',0,0,16,12);R(g,'#ff6a1a',0,4,16,3);for(let x=1;x<16;x+=4){R(g,'#22222a',x,0,2,12);R(g,'#6a6a76',x,0,1,12);}R(g,'#33333c',0,1,16,2);R(g,'#33333c',0,9,16,2);})};
const CRATE=outlineC(mk(16,22,g=>{R(g,'#2e3420',0,6,16,16);R(g,'#4a5030',1,0,14,9);R(g,'#5f6640',1,0,14,2);for(let y=2;y<9;y+=3)R(g,'#3a4026',1,y,14,1);
  R(g,'#3a4026',1,9,14,12);R(g,'#2a2e1a',1,13,14,1);R(g,'#2a2e1a',1,17,14,1);R(g,'#2a2e1a',3,9,1,12);R(g,'#2a2e1a',12,9,1,12);R(g,'#b8b890',6,12,4,1);R(g,'#b8b890',7,11,2,1);R(g,'#b8b890',6,15,4,1);}));
const BARREL=outlineC(mk(16,22,g=>{R(g,'#3a1c0c',2,4,12,17);R(g,'#5a3418',3,4,6,17);R(g,'#2a1408',2,8,12,2);R(g,'#2a1408',2,15,12,2);E(g,'#6a4020',8,4,6,3);E(g,'#2a1206',8,4,4,2);R(g,'#7a4a20',4,6,1,12);}));

      ctx.font=`${18*s}px VT323,monospace`;ctx.fillStyle='#ffd040';ctx.fillText('?',x,y-1*s);}}
  for(const n of nums){const a=Math.min(1,n.t*2.5),x=wx(n.x),y=wy(n.y)-(24+(1-n.t)*18)*K,sn=n.kind==='sneak';
    if(n.kind==='hell'){ctx.font=`${16*s}px "Press Start 2P",monospace`;ctx.fillStyle=`rgba(255,60,30,${a})`;ctx.fillText(n.v,x,y);continue;}
    ctx.font=`${(sn?30:n.kind==='crit'?26:19)*s}px VT323,monospace`;ctx.fillStyle=`rgba(0,0,0,${a*.7})`;ctx.fillText(n.v,x+2*s,y+2*s);
    ctx.fillStyle=sn?`rgba(210,120,255,${a})`:n.kind==='crit'?`rgba(255,220,60,${a})`:`rgba(255,255,255,${a})`;ctx.fillText(n.v,x,y);if(sn){ctx.font=`${15*s}px VT323,monospace`;ctx.fillText('ZE STÍNU',x,y-20*s);}}
  /* portrét a zdraví */
  const pw=54*s,ph=pw*46/40;ctx.fillStyle='#140403';ctx.fillRect(m,m,pw+6*s,ph+6*s);ctx.strokeStyle='#ff6a1a';ctx.lineWidth=2*s;ctx.strokeRect(m,m,pw+6*s,ph+6*s);
  drawFace();ctx.imageSmoothingEnabled=false;ctx.drawImage(faceC,m+3*s,m+3*s,pw,ph);if(face.hurtT>0){ctx.fillStyle=`rgba(255,0,0,${Math.min(.35,face.hurtT*.4)})`;ctx.fillRect(m+3*s,m+3*s,pw,ph);}
  const bx=m+pw+14*s,bw=Math.min(160*s,cw-bx-Math.min(110*s,cw*.27)-24*s);
  bar(bx,m,bw,16*s,P.hp/P.maxHp,P.hp<P.maxHp*.3&&(T*4|0)%2?'#ff6040':'#c81818');
  ctx.font=`${16*s}px VT323,monospace`;ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(`${Math.max(0,Math.ceil(P.hp))} / ${P.maxHp}`,bx+6*s,m+12.5*s);
  bar(bx,m+19*s,bw,7*s,P.xp/need(),'#3fd8ff');
  ctx.font=`${18*s}px VT323,monospace`;ctx.fillStyle='#ffb36b';ctx.fillText(`${STAGES[stageIdx()][1]} ${P.lvl}`,bx,m+43*s);
  ctx.fillStyle='#5ff0ff';ctx.fillText(`duše ${runSouls}`,bx,m+60*s);
  if(pendingLv>0){ctx.fillStyle=`rgba(255,120,255,${.7+.3*Math.sin(T*5)})`;ctx.fillText(`mutace po boji: ${pendingLv}`,bx,m+77*s);}
  if(splitT>0){bar(m,m+ph+12*s,pw+6*s,8*s,splitT/P.splitDur,'#a070ff');ctx.fillStyle='#e0d0ff';ctx.font=`${15*s}px VT323,monospace`;ctx.fillText(`rozpolcení ${Math.ceil(splitT)} s`,m,m+ph+34*s);}
  /* mapa */
  if(mmDirty)drawMinimap();const mm=Math.min(110*s,cw*.27),c=mm/MW,mx0=cw-m-mm,my0=m;
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(mx0,my0,mm,mm);ctx.drawImage(mmC,mx0,my0,mm,mm);ctx.strokeStyle='#6a2410';ctx.lineWidth=2*s;ctx.strokeRect(mx0,my0,mm,mm);
  if(portal){ctx.fillStyle=`rgba(180,120,255,${.6+.4*Math.sin(T*6)})`;ctx.beginPath();ctx.arc(mx0+portal.x*c,my0+portal.y*c,3*s,0,7);ctx.fill();}
  for(const e of enemies){if(!seen[(e.y|0)*MW+(e.x|0)])continue;ctx.fillStyle=!e.alert?'#ffd040':e.type==='boss'?'#ffd040':'#ff3030';ctx.fillRect(mx0+e.x*c-1.4*s,my0+e.y*c-1.4*s,2.8*s,2.8*s);}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx0+P.x*c,my0+P.y*c,2.3*s,0,7);ctx.fill();
  /* stav */
  const sy0=cw>ch?m+20*s:(Math.min(110,cw/s*.27)+86)*s;ctx.textAlign='center';ctx.font=`${22*s}px VT323,monospace`;ctx.fillStyle='#fff';ctx.fillText(`KRUH ${depth}`,cw/2,sy0);
  ctx.font=`${17*s}px VT323,monospace`;ctx.fillStyle='#ff8a5a';
  if(boss&&!boss.dead){const w=Math.min(300*s,cw*.7);bar(cw/2-w/2,sy0+8*s,w,14*s,boss.hp/boss.maxHp,'#ff7a1a');ctx.fillStyle='#fff';ctx.font=`${14*s}px VT323,monospace`;ctx.fillText('HRDINA',cw/2,sy0+19*s);}
  else{const fr=fightRooms();ctx.fillText(portal?'Vstup do portálu':curRoom?`Posily ${curRoom.wave} / ${curRoom.waves}`:`Vyčištěno ${fr.filter(r=>r.cleared).length} / ${fr.length} místností`,cw/2,sy0+20*s);}
  if(combo>=5){ctx.textAlign='right';ctx.font=`${22*s}px "Press Start 2P",monospace`;ctx.fillStyle=`rgba(255,${combo>=15?80:160},40,${Math.min(1,comboT)})`;ctx.fillText(`×${combo}`,cw-m,ch*.5);}
  const ab=isTouch&&cw>ch?26*s:(86+12)*s;
  if(P.crouch){ctx.textAlign='center';ctx.font=`${Math.min(19*s,cw/22)}px VT323,monospace`;ctx.fillStyle='rgba(220,180,255,.95)';ctx.fillText('PLÍŽÍŠ SE · koule nelétají, drápy ano',cw/2,ch-ab);}
  if(bannerT>0){ctx.textAlign='center';ctx.font=`${Math.min(30*s,cw/14)}px "Press Start 2P",monospace`;const a=Math.min(1,bannerT);
    ctx.fillStyle=`rgba(40,0,0,${a*.8})`;ctx.fillText(banner,cw/2+3*s,ch*.4+3*s);ctx.fillStyle=`rgba(255,90,30,${a})`;ctx.fillText(banner,cw/2,ch*.4);
    if(bannerSub){ctx.font=`${22*s}px VT323,monospace`;ctx.fillStyle=`rgba(255,200,160,${a})`;ctx.fillText(bannerSub,cw/2,ch*.4+30*s);}}
  if(moveT){ctx.strokeStyle='rgba(255,180,120,.45)';ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(moveT.sx*s,moveT.sy*s,45*s,0,7);ctx.stroke();
    let dx=moveT.x-moveT.sx,dy=moveT.y-moveT.sy;const l=Math.hypot(dx,dy);if(l>45){dx*=45/l;dy*=45/l;}ctx.fillStyle='rgba(255,140,80,.5)';ctx.beginPath();ctx.arc((moveT.sx+dx)*s,(moveT.sy+dy)*s,18*s,0,7);ctx.fill();}}

/* ---------- smyčka ---------- */
reset(true);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state==='play')update(dt);else if(state==='menu'){T+=dt;P.x+=Math.cos(T*.3)*dt*.3;P.y+=Math.sin(T*.25)*dt*.2;}
  render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
}
</script>
</body>
